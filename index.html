<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HCMC Insider – Ho Chi Minh City (Saigon) food, sights &amp; local tips</title>
<meta name="description" content="Ho Chi Minh City (Saigon) travel guide by locals: noodle stalls, dim sum, sweet soups, markets and temples in Cholon (Chinatown), hand-picked from local creators' videos, with English descriptions, a map and directions.">
<meta property="og:title" content="HCMC Insider">
<meta property="og:description" content="Eat where Ho Chi Minh City's food creators eat. Hand-picked spots in Cholon with English descriptions and directions.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hcmcinsider.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23C8102E'/%3E%3Cellipse cx='16' cy='18' rx='8' ry='9' fill='%23FFB627'/%3E%3Crect x='15' y='3' width='2' height='7' fill='%23FFB627'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: lacquer-red hero with hanging lanterns → sticky colour-chip filter → sketch map beside signboard cards → numbered Top Picks → suggest form. Signboard type for English labels, grotesque for Vietnamese place names. */
:root{
  --bg:#F7F5FB; --surface:#FFFFFF; --sunk:#EFEBF6; --ink:#17122B; --muted:#5E5872; --line:#E2DCEC;
  --red:#C8102E; --hero:#C8102E; --hero-ink:#FFFFFF; --saffron:#FFB627; --saffron-ink:#2A1A00; --jade:#0E9F8E;
  --c-food:#E8452C; --c-cafe:#B4632C; --c-shop:#7B4FD6; --c-culture:#0E9F8E; --c-stay:#2F7DE1; --c-other:#6B7280;
  --on-cat:#FFFFFF;
  --yt:#E62117; --fb:#1877F2; --tt:#17122B; --ig:#C13584; --web:#5E5872;
  --sign:"Bungee","Bricolage Grotesque",system-ui,sans-serif;
  --display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#120F1C; --surface:#1C1829; --sunk:#252036; --ink:#F1EEF8; --muted:#A9A2BD; --line:#332C47;
  --red:#FF5A6A; --hero:#9E0D25; --hero-ink:#FFFFFF; --saffron:#FFC94D; --saffron-ink:#2A1A00; --jade:#3CCFB9;
  --c-food:#FF6B4D; --c-cafe:#D98C52; --c-shop:#A584F0; --c-culture:#3CCFB9; --c-stay:#5DA0F5; --c-other:#9AA0AC;
  --on-cat:#120F1C;
  --yt:#FF5A52; --fb:#5B9DFF; --tt:#F1EEF8; --ig:#F06BB5; --web:#A9A2BD; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#120F1C; --surface:#1C1829; --sunk:#252036; --ink:#F1EEF8; --muted:#A9A2BD; --line:#332C47;
  --red:#FF5A6A; --hero:#9E0D25; --hero-ink:#FFFFFF; --saffron:#FFC94D; --saffron-ink:#2A1A00; --jade:#3CCFB9;
  --c-food:#FF6B4D; --c-cafe:#D98C52; --c-shop:#A584F0; --c-culture:#3CCFB9; --c-stay:#5DA0F5; --c-other:#9AA0AC;
  --on-cat:#120F1C;
  --yt:#FF5A52; --fb:#5B9DFF; --tt:#F1EEF8; --ig:#F06BB5; --web:#A9A2BD; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hero)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--hero);color:var(--hero-ink)}
.bar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.logo{font-family:var(--sign);font-size:19px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none}
.logo i{width:14px;height:18px;border-radius:50% 50% 45% 45%;background:var(--saffron);box-shadow:0 0 0 3px rgba(255,255,255,.18);display:block;position:relative}
.logo i::before{content:"";position:absolute;left:50%;top:-6px;width:2px;height:6px;background:var(--saffron);transform:translateX(-50%)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{font-weight:600;font-size:14px;text-decoration:none;padding:6px 11px;border-radius:999px}
.nav a:hover{background:rgba(255,255,255,.16)}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);position:relative;overflow:hidden}
.hero .wrap{position:relative;z-index:1;padding-block:34px 40px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end}
.lanterns{position:absolute;inset:0 0 auto 0;height:80px;pointer-events:none;opacity:.95}
.lanterns span{position:absolute;top:0;width:2px;background:rgba(255,255,255,.35)}
.lanterns span::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-26px;width:24px;height:30px;border-radius:50% 50% 44% 44%;background:var(--saffron);box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 0 24px rgba(255,182,39,.55)}
.lanterns span:nth-child(3n)::after{background:#FF7A3D}
.lanterns span:nth-child(4n)::after{background:#FFE07A}
@media (prefers-reduced-motion:no-preference){.lanterns span{animation:sway 5s ease-in-out infinite alternate;transform-origin:top center}.lanterns span:nth-child(2n){animation-duration:6.5s}}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.eyebrow{font-family:var(--sign);font-size:13px;letter-spacing:.06em;color:var(--saffron);margin:62px 0 10px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,64px);line-height:.98;letter-spacing:-.03em;margin:0 0 14px;text-wrap:balance}
.hero h1 mark{background:var(--saffron);color:var(--saffron-ink);padding:0 .12em;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hero p{margin:0;max-width:52ch;font-size:16px;opacity:.92}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:var(--r);padding:14px 14px 12px}
.stat b{display:block;font-family:var(--sign);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.tip{grid-column:1/-1;font-size:13px;opacity:.85;margin:0}

/* filter bar */
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.filters .wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:12px}
.chip{border:2px solid var(--cc,var(--line));background:var(--surface);border-radius:999px;padding:5px 13px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;color:var(--ink)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--cc,var(--muted))}
.chip[aria-pressed="true"]{background:var(--cc,var(--ink));color:var(--on-cat);border-color:var(--cc,var(--ink))}
.chip[aria-pressed="true"] i{background:var(--on-cat)}
.chip.all{--cc:var(--ink)}
.chip.all[aria-pressed="true"]{color:var(--bg)}
.search{flex:1 1 200px;min-width:0;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 15px}

/* main */
.main{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:22px;align-items:start;padding-block:22px}
.mapbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 128px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.maphead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.maphead b{font-family:var(--sign);font-size:14px;letter-spacing:.03em}
.maphead span{font-size:13px;color:var(--muted)}
#map{display:block;width:100%;height:auto;background:var(--sunk)}
#map .pin{cursor:pointer}
#map .pin text{font:700 11px var(--body);fill:#fff}
.mapsoon{padding:28px 18px;display:grid;gap:6px;background:var(--sunk)}
.mapsoon b{font-family:var(--display);font-size:18px}
.mapsoon p{margin:0;color:var(--muted);font-size:14px}
.mapnote{padding:10px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;scroll-margin-top:150px;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(23,18,43,.35)}
.card.flash{box-shadow:0 0 0 4px var(--saffron)}
.sign{background:var(--cc);color:var(--on-cat);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;position:relative}
.sign::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:radial-gradient(circle at 6px -1px,var(--cc) 6px,transparent 6.5px) 0 0/12px 6px repeat-x}
.sign .n{font-family:var(--sign);font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.sign .k{font-family:var(--sign);font-size:11px;letter-spacing:.08em}
.cbody{padding:16px 14px 14px;display:grid;gap:10px;flex:1;align-content:start}
.card h3{margin:0;font-family:var(--display);font-weight:800;font-size:20px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.where{font-size:13px;color:var(--muted);margin-top:3px}
.vn{font-size:13px;color:var(--muted);font-style:italic;margin-top:2px}
.dish{display:inline-block;font-size:12px;font-weight:700;color:var(--cc);margin-bottom:4px;letter-spacing:.01em}
.card p{margin:0}
.vids{display:grid;gap:6px}
.vid{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--sunk);text-decoration:none;min-width:0}
.vid:hover{outline:2px solid var(--cc)}
.play{flex:none;width:30px;height:30px;border-radius:50%;background:var(--pc);display:grid;place-items:center}
.play::before{content:"";border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
.vid-t{min-width:0;flex:1;display:grid}
.vid-t strong{font-weight:600;font-size:13px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vid-t span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vid-t .tr{font-size:12.5px;line-height:1.3;color:var(--ink);opacity:.85}
.vid-t .tr::before{content:"EN · ";font-style:normal;font-weight:700;color:var(--cc)}
.more{font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding:0 14px 14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.go{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.saved{background:var(--saffron);border-color:var(--saffron);color:var(--saffron-ink)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.small{padding:4px 11px;font-size:13px}
.btn.danger{color:var(--red)}
.empty{grid-column:1/-1;background:var(--surface);border:2px dashed var(--line);border-radius:var(--r);padding:28px 22px;display:grid;gap:10px;justify-items:start}
.empty h3{margin:0;font-family:var(--display);font-size:22px}
.empty p{margin:0;color:var(--muted);max-width:52ch}

/* sections */
section.block{padding-block:40px 8px}
.kicker{font-family:var(--sign);font-size:12px;letter-spacing:.08em;color:var(--red);margin:0 0 6px}
section.block h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,36px);letter-spacing:-.02em;margin:0 0 6px}
section.block .lead{margin:0 0 20px;color:var(--muted);max-width:62ch}
.top{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px;list-style:none;margin:0;padding:0}
.top button{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;align-items:center;cursor:pointer;text-align:left}
.top button:hover{border-color:var(--cc)}
.top .rk{grid-row:span 2;width:52px;height:52px;border-radius:12px;background:var(--cc);color:var(--on-cat);display:grid;place-items:center;font-family:var(--sign);font-size:24px}
.top strong{font-family:var(--display);font-size:17px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top span{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px}
.suggest{background:linear-gradient(135deg,var(--surface) 60%,var(--sunk));border:2px solid var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label.f{display:grid;gap:4px;font-size:13px;font-weight:700;min-width:0}
label.f small{font-weight:400;color:var(--muted)}
.f input,.f select,.f textarea{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-weight:400;font-size:14px;width:100%;min-width:0}
.f textarea{min-height:70px;resize:vertical}
.out{background:var(--sunk);border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap;word-break:break-word;user-select:all}
.hint{font-size:13px;color:var(--muted);margin:0}
.ok{color:var(--jade);font-weight:700;font-size:13px}
.admin{border:2px solid var(--jade)}
.admin h3{margin:0;font-family:var(--display);font-size:20px}
.rows{display:grid;gap:6px;max-height:420px;overflow:auto}
.row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px;min-width:0}
.row > span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--ink);color:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.savebar span{margin-right:auto;font-size:14px}
.savebar .btn{background:var(--saffron);border-color:var(--saffron);color:var(--saffron-ink)}
footer{margin-top:40px;background:var(--ink);color:var(--bg)}
footer .wrap{padding-block:28px 90px;display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between;font-size:13px}
footer .logo{font-size:16px;margin:0}
footer p{margin:0;max-width:60ch;opacity:.8}
@media (max-width:860px){
  .hero .wrap{grid-template-columns:1fr}
  .main{grid-template-columns:1fr}.mapbox{position:static;order:2}
  .grid2{grid-template-columns:1fr}
  .filters{top:calc(env(safe-area-inset-top,0px) + 92px)}
}
@media (max-width:520px){.nav{display:none}.filters{position:static}.stats{gap:6px}.stat b{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}

#lmap{height:460px;width:100%;background:var(--sunk);z-index:0}
.lpin span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font:700 12px var(--body);border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.leaflet-tooltip{font-family:var(--body);font-weight:600}
@media (max-width:860px){#lmap{height:340px}}
</style>
</head>
<body>
<div id="root"></div>
<div hidden><div id="lmap"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
"use strict";
var STATE = {v:1,contact:"",places:[],videos:[]};
var CATS = [
  {k:"food",en:"Eat",vi:"Ăn uống"},
  {k:"cafe",en:"Coffee & tea",vi:"Cà phê – trà"},
  {k:"shop",en:"Markets",vi:"Mua sắm"},
  {k:"culture",en:"Culture",vi:"Di tích – văn hóa"},
  {k:"stay",en:"Stay",vi:"Lưu trú"},
  {k:"other",en:"Other",vi:"Khác"}
];
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var ui = {cat:"all", q:"", savedOnly:false, admin:false, canEdit:false, artifact:null, dirty:0, saveErr:"", impMsg:"", impKeep:"", editPlace:null, confirmDel:null, subOut:"", copied:false, subErr:"", showAll:{}};
var favs; try{favs = JSON.parse(ls("ad_favs")||"[]")}catch(e){favs=[]}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)}
function cat(k){for(var i=0;i<CATS.length;i++)if(CATS[i].k===k)return CATS[i];return CATS[5]}
function cc(k){return "var(--c-"+cat(k).k+")"}
function platform(url){var u=String(url).toLowerCase();
  if(u.indexOf("tiktok.")>-1)return["TikTok","var(--tt)"];
  if(u.indexOf("youtube.")>-1||u.indexOf("youtu.be")>-1)return["YouTube","var(--yt)"];
  if(u.indexOf("facebook.")>-1||u.indexOf("fb.watch")>-1)return["Facebook","var(--fb)"];
  if(u.indexOf("instagram.")>-1)return["Instagram","var(--ig)"];
  return["Web","var(--web)"]}
function safeUrl(u){u=String(u||"").trim();return /^https?:\/\//i.test(u)?u:""}
function compact(n){try{return new Intl.NumberFormat("en",{notation:"compact",maximumFractionDigits:1}).format(n)}catch(e){return String(n)}}
function vidsOf(pid){return STATE.videos.filter(function(v){return v.placeId===pid})}
function viewsOf(pid){return vidsOf(pid).reduce(function(s,v){return s+(+v.views||0)},0)}
function pName(p){return p.nameEn||p.name}
function addrEn(a){return String(a||"")
  .replace(/Quận (\d+) cũ/g,"District $1").replace(/\bQuận (\d+)/g,"District $1")
  .replace(/\bP\.\s*/g,"Ward ").replace(/Phường /g,"Ward ").replace(/Đường số/g,"Street")
  .replace(/^Chợ Lớn$/,"Cholon (Chinatown)").replace(/Tân Phú$/,"Tan Phu District")}

function dirLink(p){
  if(hasXY(p))return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(p.lat+","+p.lng);

function parseCoords(s){s=String(s||"");var m=s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||s.match(/[?&](?:q|query|destination|ll)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/)||s.match(/^\s*(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)\s*$/);

  if(b.id==="ap-cancel"){ui.editPlace=null;render();return}

    try{navigator.clipboard.writeText(txt).then(function(){ui.copied=true;render()},selectOut)}catch(err){selectOut()}return}
  if(b.id==="publish"){publish(b);return}
  if(b.id==="impBtn"){importData(val("imp-data"));return}
});
root.addEventListener("keydown",function(e){var g=e.target.closest&&e.target.closest("g.pin");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();go(g.dataset.go)}});
function selectOut(){var o=document.getElementById("subOut");if(!o)return;var r=document.createRange();r.selectNodeContents(o);var s=getSelection();s.removeAllRanges();s.addRange(r)}
root.addEventListener("input",function(e){
  if(e.target.id==="q"){ui.q=e.target.value;render();return}
  if(e.target.id==="ap-maps"){var c=parseCoords(e.target.value),w=document.getElementById("ap-warn");if(c){document.getElementById("ap-lat").value=c.lat;document.getElementById("ap-lng").value=c.lng}
    if(w)w.hidden=!(!c&&/goo\.gl|maps\.app/i.test(e.target.value))}
});
root.addEventListener("change",function(e){
  if(e.target.dataset&&e.target.dataset.views){var v=STATE.videos.filter(function(x){return x.id===e.target.dataset.views})[0];if(v){v.views=parseInt(e.target.value.replace(/\D/g,""),10)||0;touch()}}
  if(e.target.id==="a-contact"){STATE.contact=e.target.value.trim();touch()}
});
root.addEventListener("submit",function(e){
  e.preventDefault();var f=e.target;
  if(f.id==="fSub"){
    var link=val("s-link"),place=val("s-place");
    if(!link||!place){ui.subErr="Please add the link and the place name.";ui.subOut="";render();return}
    ui.subErr="";ui.copied=false;
    ui.subOut="SPOT SUGGESTION – HCMC INSIDER\n- Place: "+place+(val("s-addr")?"\n- Address: "+val("s-addr"):"")+"\n- Link: "+link+(val("s-creator")?"\n- Creator: "+val("s-creator"):"")+(val("s-note")?"\n- Note: "+val("s-note"):"")+(val("s-me")?"\n- From: "+val("s-me"):"");
    render();return}
  if(f.id==="fPlace"){
    var c=parseCoords(val("ap-lat")+","+val("ap-lng"));
    var data={name:val("ap-name"),nameEn:val("ap-nameEn"),cat:val("ap-cat")||"food",addr:val("ap-addr"),maps:val("ap-maps"),lat:c?c.lat:"",lng:c?c.lng:"",note:val("ap-note"),noteEn:val("ap-noteEn")};
    if(!data.name)return;
    if(ui.editPlace){var p=STATE.places.filter(function(x){return x.id===ui.editPlace})[0];if(p)Object.assign(p,data);ui.editPlace=null}
    else{data.id=uid();STATE.places.push(data)}
    touch();return}
  if(f.id==="fVid"){
    var url=safeUrl(val("av-url"));if(!url)return;
    STATE.videos.push({id:uid(),placeId:val("av-place"),url:url,title:val("av-title"),titleEn:val("av-titleEn"),creator:val("av-creator"),views:parseInt(val("av-views").replace(/\D/g,""),10)||0,added:new Date().toISOString().slice(0,10)});
    touch();return}
});
function norm(x){return String(x||"").trim().toLowerCase().replace(/\s+/g," ")}
function importData(txt){
  txt=String(txt||"");var a=txt.indexOf("{"),b=txt.lastIndexOf("}");
  if(!txt.trim()){ui.impMsg="Ô dữ liệu đang trống. Hãy dán (Ctrl+V) dữ liệu vào ô trên.";render();return}
  var d;try{d=JSON.parse(txt.slice(a,b+1))}catch(e){ui.impKeep=txt;ui.impMsg="Dữ liệu chưa đủ ("+txt.length+" ký tự). Nếu dữ liệu dài, hãy nhắn Claude nhập giúp.";render();return}
  if(!d||!(d.places||d.videos)){ui.impKeep=txt;ui.impMsg="Không tìm thấy địa điểm hay video trong dữ liệu này.";render();return}
  ui.impKeep="";
  var map={},addP=0,addV=0,skip=0,today=new Date().toISOString().slice(0,10);
  (d.places||[]).forEach(function(np){if(!np||!np.name)return;
    var ex=STATE.places.filter(function(p){return norm(p.name)===norm(np.name)})[0];
    if(!ex){ex={id:uid(),name:String(np.name),nameEn:"",cat:cat(np.cat).k,addr:String(np.addr||""),maps:"",lat:np.lat?String(np.lat):"",lng:np.lng?String(np.lng):"",note:"",noteEn:""};STATE.places.push(ex);addP++}
    else{if(!hasXY(ex)&&np.lat&&np.lng){ex.lat=String(np.lat);ex.lng=String(np.lng)}if(!ex.addr&&np.addr)ex.addr=String(np.addr)}
    map[norm(np.name)]=ex.id});
  (d.videos||[]).forEach(function(v){var url=safeUrl(v&&v.url),pid=map[norm(v&&v.place)];
    if(!url||!pid){skip++;return}
    if(STATE.videos.some(function(x){return x.url===url})){skip++;return}
    STATE.videos.push({id:uid(),placeId:pid,url:url,title:String(v.title||""),titleEn:String(v.titleEn||""),creator:String(v.creator||""),views:+v.views||0,added:today});addV++});
  ui.impMsg="Đã thêm "+addP+" địa điểm, "+addV+" video"+(skip?" (bỏ qua "+skip+" video trùng hoặc thiếu thông tin)":"")+". Bấm “Lưu & cập nhật trang” ở dưới cùng.";
  if(addP||addV)touch();else render();
}
function buildDoc(){
  var reset=(document.head.querySelector("style")||{}).textContent||"";
  var css=document.getElementById("page-css").textContent;
  var app=document.getElementById("app").textContent;
  var json=JSON.stringify(STATE).replace(/</g,"\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    '<title>HCMC Insider</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">\n'+
    '<style id="page-css">'+css+'</style>\n<script type="application/json" id="state">'+json+'<\/script>\n<div id="root"></div>\n<script id="app">'+app+'<\/script></body></html>';
}
function publish(btn){
  return;
  btn.disabled=true;btn.textContent="Đang lưu…";ui.saveErr="";
  ui.artifact.publish(buildDoc()).then(function(){ui.dirty=0},function(err){
    var code=(err&&err.code)||"";
    ui.saveErr=code==="conflict"?"Trang vừa được cập nhật ở nơi khác, thay đổi này chưa lưu. Tải lại trang rồi nhập lại.":
      (code==="not_granted"||code==="not_writer")?"Bạn chưa cho phép trang tự lưu (hoặc không có quyền sửa). Mở menu Permissions của trang để cho phép, rồi bấm lưu lại.":
      "Chưa lưu được"+(code?" (mã lỗi: "+code+")":"")+". Bấm lưu lại; nếu vẫn lỗi, chụp màn hình gửi Claude.";
    render();
  });
}
window.addEventListener("beforeunload",function(e){if(ui.dirty){e.preventDefault();e.returnValue=""}});
document.documentElement.lang="en";
render();
fetch("data.json",{cache:"no-cache"}).then(function(r){return r.json()}).then(function(d){STATE=d;render()}).catch(function(){});
})();
</script>
</body>
